name: Sync Upstream & Build & Release

on:
  # 手动触发
  workflow_dispatch:
  # 定时检查上游（每天凌晨 3 点，UTC+8）
  schedule:
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 配置 git（publish/build 需要）
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config remote.origin.url "https://x-access-token:${GITHUB_TOKEN}@github.com/veenyi/fnos-hermes-agent-web.git"
          git tag --sort=-creatordate | head -3 || true

      # 检测上游版本 + 更新 VERSION（无新提交时脚本直接退出，后续步骤跳过）
      - name: Detect upstream & bump version
        id: version
        run: |
          node scripts/sync-upstream.js
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 拉取上游 hermes-src（仅当 VERSION 变化需要构建时）
      - name: Clone upstream
        run: |
          if [ ! -d "upstream/.git" ]; then
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git upstream
          else
            (cd upstream && git fetch --depth 1 origin main && git reset --hard origin/main)
          fi
          echo "upstream version: $(grep -m1 '^version' upstream/pyproject.toml)"

      - name: Check version changed
        id: check
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "prev_tag=$PREV_TAG"
          echo "new_version=${{ steps.version.outputs.version }}"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "v${{ steps.version.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 提取 venv-bundle（从上一 Release 的完整包，180MB 不提交仓库）
      - name: Fetch venv-bundle from previous release
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir -p fpk
          if [ ! -f fpk/venv-bundle.tar.gz ]; then
            PREV_RELEASE_URL="$(curl -sS -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/veenyi/fnos-hermes-agent-web/releases/latest' | grep -oE '"browser_download_url":"[^"]*\.fpk"' | head -1 | sed -E 's/.*:"([^"]*)"/\1/')"
            if [ -n "$PREV_RELEASE_URL" ]; then
              echo "下载上一完整包: $PREV_RELEASE_URL"
              curl -sSL -o /tmp/prev.fpk "$PREV_RELEASE_URL"
              (cd /tmp && tar xzf prev.fpk app.tgz && tar xzf app.tgz venv-bundle.tar.gz && mv venv-bundle.tar.gz "$GITHUB_WORKSPACE/fpk/venv-bundle.tar.gz")
            fi
          fi
          ls -la fpk/venv-bundle.tar.gz 2>/dev/null && echo "✓ venv-bundle 就绪" || echo "⚠ 无 venv-bundle（首个 Release 需手动提供）"

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: |
          bash scripts/build.sh

      - name: Publish
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish.sh

      - name: Commit version bump
        if: steps.check.outputs.changed == 'true'
        run: |
          git add VERSION .upstream-state
          git commit -m "version: bump to ${{ steps.version.outputs.version }}" --allow-empty
          git push origin HEAD:main
